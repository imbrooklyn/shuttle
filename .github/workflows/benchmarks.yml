name: Benchmarks

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  benchmark:
    name: Allocation-aware benchmark snapshot
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.27.0'
          check-latest: false
      - run: go test ./... -run=^$ -bench=. -benchmem -benchtime=1x
