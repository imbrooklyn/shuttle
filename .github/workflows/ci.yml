name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: '23 4 * * 1'

permissions:
  contents: read

env:
  GO_VERSION: '1.27.0'
  GOTOOLCHAIN: local

jobs:
  native-test:
    name: Native test (${{ matrix.name }})
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            os: ubuntu-24.04
          - name: linux-arm64
            os: ubuntu-24.04-arm
          - name: macos-amd64
            os: macos-15-intel
          - name: macos-arm64
            os: macos-15
          - name: windows-amd64
            os: windows-2025
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: false
      - run: go version
      - run: go test ./...
      - run: go test -race ./...
      - run: go vet ./...

  cross-compile:
    name: Cross-compile (${{ matrix.goos }}-${{ matrix.goarch }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: false
      - name: Compile packages and tests without execution
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        shell: bash
        run: |
          mkdir -p "${RUNNER_TEMP}/cross-tests"
          go test -c -o "${RUNNER_TEMP}/cross-tests/" ./...

  fuzz:
    name: Bounded fuzz (${{ matrix.name }})
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            os: ubuntu-24.04
          - name: linux-arm64
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: false
      - run: go test ./optional -run=^$ -fuzz=^FuzzOptionalJSON$ -fuzztime=10s
      - run: go test ./comparator -run=^$ -fuzz=^FuzzReverseLaws$ -fuzztime=10s
      - run: go test ./comparator -run=^$ -fuzz=^FuzzThenMatchesReference$ -fuzztime=10s
      - run: go test ./comparator -run=^$ -fuzz=^FuzzFluentCompositionMatchesReference$ -fuzztime=10s
      - run: go test ./comparator -run=^$ -fuzz=^FuzzByMatchesCompare$ -fuzztime=10s
      - run: go test ./comparator -run=^$ -fuzz=^FuzzAscendingDescendingKeyOrder$ -fuzztime=10s
      - run: go test ./comparator -run=^$ -fuzz=^FuzzGeneratedOrderingLaws$ -fuzztime=10s
      - run: go test ./predicate -run=^$ -fuzz=^FuzzDoubleNegation$ -fuzztime=10s
      - run: go test ./predicate -run=^$ -fuzz=^FuzzBooleanLaws$ -fuzztime=10s
      - run: go test ./predicate -run=^$ -fuzz=^FuzzIsNotNilNegation$ -fuzztime=10s
      - run: go test ./predicate -run=^$ -fuzz=^FuzzCompositionMatchesReference$ -fuzztime=10s
      - run: go test ./stream -run=^$ -fuzz=^FuzzStreamFiniteProperties$ -fuzztime=10s

  analysis:
    name: Static and vulnerability analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: false
      - name: Install pinned analysis tools
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@2026.2rc1
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
      - run: staticcheck ./...
      - run: govulncheck ./...

  public-api:
    name: Public API baseline and diff
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: false
      - name: Snapshot candidate public API and GoDoc
        shell: bash
        run: bash .github/scripts/api-snapshot.sh > "${RUNNER_TEMP}/candidate-api.txt"
      - name: Compare candidate with committed v1 baseline
        id: baseline
        continue-on-error: true
        shell: bash
        run: |
          set +e
          diff -u api/shuttle-v1.txt "${RUNNER_TEMP}/candidate-api.txt" > "${RUNNER_TEMP}/api-baseline.diff"
          status=$?
          cp "${RUNNER_TEMP}/api-baseline.diff" "${RUNNER_TEMP}/api.diff"
          cp api/shuttle-v1.txt "${RUNNER_TEMP}/base-api.txt"
          exit "${status}"
      - name: Check out pull request base
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: api-base
      - name: Snapshot pull request base API and GoDoc
        if: github.event_name == 'pull_request'
        working-directory: api-base
        shell: bash
        run: bash "${GITHUB_WORKSPACE}/.github/scripts/api-snapshot.sh" > "${RUNNER_TEMP}/base-api.txt"
      - name: Generate pull request API report
        if: github.event_name == 'pull_request'
        continue-on-error: true
        shell: bash
        run: diff -u "${RUNNER_TEMP}/base-api.txt" "${RUNNER_TEMP}/candidate-api.txt" > "${RUNNER_TEMP}/api.diff"
      - name: Upload API snapshots and diff
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: public-api-${{ github.sha }}
          path: |
            ${{ runner.temp }}/candidate-api.txt
            ${{ runner.temp }}/base-api.txt
            ${{ runner.temp }}/api-baseline.diff
            ${{ runner.temp }}/api.diff
          if-no-files-found: error
          retention-days: 90
      - name: Enforce committed API baseline
        if: steps.baseline.outcome == 'failure'
        shell: bash
        run: |
          cat "${RUNNER_TEMP}/api-baseline.diff"
          echo "Public API or GoDoc differs from api/shuttle-v1.txt. Review the change and regenerate the baseline explicitly."
          exit 1
