name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: '23 4 * * 1'

permissions:
  contents: read

env:
  GO_VERSION: '1.27.0'

jobs:
  native-test:
    name: Native test (${{ matrix.name }})
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            os: ubuntu-24.04
          - name: linux-arm64
            os: ubuntu-24.04-arm
          - name: macos-amd64
            os: macos-15-intel
          - name: macos-arm64
            os: macos-15
          - name: windows-amd64
            os: windows-2025
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: false
      - run: go version
      - run: go test ./...
      - run: go test -race ./...
      - run: go vet ./...

  cross-compile:
    name: Cross-compile (${{ matrix.goos }}-${{ matrix.goarch }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: false
      - name: Compile packages and tests without execution
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: go test -exec=/bin/true ./...

  fuzz:
    name: Bounded fuzz (${{ matrix.name }})
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            os: ubuntu-24.04
          - name: linux-arm64
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: false
      - run: go test ./optional -run=^$ -fuzz=^FuzzOptionalJSON$ -fuzztime=10s
      - run: go test ./comparator -run=^$ -fuzz=^FuzzReverseLaws$ -fuzztime=10s
      - run: go test ./comparator -run=^$ -fuzz=^FuzzThenMatchesReference$ -fuzztime=10s
      - run: go test ./comparator -run=^$ -fuzz=^FuzzFluentCompositionMatchesReference$ -fuzztime=10s
      - run: go test ./comparator -run=^$ -fuzz=^FuzzByMatchesCompare$ -fuzztime=10s
      - run: go test ./comparator -run=^$ -fuzz=^FuzzAscendingDescendingKeyOrder$ -fuzztime=10s
      - run: go test ./comparator -run=^$ -fuzz=^FuzzGeneratedOrderingLaws$ -fuzztime=10s
      - run: go test ./predicate -run=^$ -fuzz=^FuzzDoubleNegation$ -fuzztime=10s
      - run: go test ./predicate -run=^$ -fuzz=^FuzzBooleanLaws$ -fuzztime=10s
      - run: go test ./predicate -run=^$ -fuzz=^FuzzIsNotNilNegation$ -fuzztime=10s
      - run: go test ./predicate -run=^$ -fuzz=^FuzzCompositionMatchesReference$ -fuzztime=10s
      - run: go test ./stream -run=^$ -fuzz=^FuzzStreamFiniteProperties$ -fuzztime=10s

  analysis:
    name: Static and vulnerability analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: false
      - name: Install pinned analysis tools
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@2026.2rc1
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
      - run: staticcheck ./...
      - run: govulncheck ./...
